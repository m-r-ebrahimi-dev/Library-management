spring:
  application:
    name: library-management
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driverClassName: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: true
    format-sql: true
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enable: true
      path: /h2-console


